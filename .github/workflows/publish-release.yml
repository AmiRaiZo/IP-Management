name: Publish versioned GitHub release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-release:
    if: startsWith(github.event.head_commit.message, 'Release IP Management v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application and responsive regression tests
        run: python -m unittest -v

      - name: Validate version and prepare release notes
        id: release-meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not semantic X.Y.Z." >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v version="$VERSION" '
            $0 == "## Version " version " release notes" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' RELEASE_NOTES.md > release-notes.md
          test -s release-notes.md || { echo "RELEASE_NOTES.md has no release notes for $VERSION." >&2; exit 1; }

      - name: Build versioned install archive
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="station-archive-v${VERSION}.zip"
          python3 - "$VERSION" "$ASSET" <<'PY'
          import pathlib, sys, zipfile
          version, output = sys.argv[1:]
          root = pathlib.Path(".")
          package = pathlib.Path(output)
          # Collect root files before opening the output archive; otherwise the archive could include itself.
          excluded = {"test_app.py", ".gitignore"}
          root_files = [
              path for path in root.iterdir()
              if path.is_file() and path.resolve() != package.resolve()
              and path.name not in excluded and not path.name.startswith(".")
          ]
          with zipfile.ZipFile(package, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root_files):
                  if path.name == "VERSION":
                      archive.writestr("VERSION", version + "\n")
                  else:
                      archive.write(path, path.name)
              for folder in ("templates", "static"):
                  directory = root / folder
                  if not directory.is_dir():
                      raise SystemExit(f"Required package folder is missing: {folder}")
                  for path in sorted(directory.rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {"app.py", "requirements.txt", "VERSION", "station-archive-update",
                          "install.sh", "reconfigure_server.sh"}
              missing = required - names
              if missing or not any(n.startswith("templates/") for n in names) or not any(n.startswith("static/") for n in names):
                  raise SystemExit("Release package validation failed: " + ", ".join(sorted(missing)))
              packaged_version = archive.read("VERSION").decode("utf-8").strip()
              if packaged_version != version:
                  raise SystemExit(f"Package VERSION {packaged_version!r} differs from expected {version!r}.")
          print(f"Built and validated {package} for version {version}")
          PY
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create or refresh GitHub Release and upload archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release-meta.outputs.version }}
          ASSET: ${{ steps.package.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "IP Management $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "IP Management $TAG" \
              --notes-file release-notes.md
          fi
          # Always attach or refresh the installable ZIP, including for an already-published tag.
          gh release upload "$TAG" "$ASSET" --clobber

      - name: Keep the newest two releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "IP-Management-Release-Retention",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return json.loads(body.decode()) if body else None
              except urllib.error.HTTPError as exc:
                  if method == "DELETE" and exc.code == 404:
                      return None
                  raise
          releases = []
          page = 1
          while page <= 10:
              batch = request(f"/releases?per_page=100&page={page}") or []
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          releases.sort(key=lambda item: item.get("published_at") or item.get("created_at") or "", reverse=True)
          stale = releases[2:]
          print(f"Found {len(releases)} releases; keeping the newest two and deleting {len(stale)} older releases.")
          for release in stale:
              rid = release["id"]
              tag = release.get("tag_name", "")
              request(f"/releases/{rid}", "DELETE")
              print(f"Deleted release {tag} (id {rid}).")
              if tag:
                  try:
                      request(f"/git/refs/tags/{urllib.parse.quote(tag, safe='')}", "DELETE")
                      print(f"Deleted tag {tag}.")
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (404, 422):
                          raise
                      print(f"Tag {tag} was already absent or could not be deleted ({exc.code}); continuing.")
          PY