name: Publish versioned release

on:
  push:
    paths:
      - VERSION
      - templates/base.html
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact semantic version (for example 2.0.0). Leave blank to auto-increment the patch version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment shell scripts
        shell: bash
        run: bash -n install.sh station-archive-update upgrade_existing.sh update.sh uninstall.sh reconfigure_server.sh

      - name: Run application tests
        if: ${{ !contains(github.event.head_commit.message, '[ui-only]') }}
        shell: bash
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements.txt
          .venv-ci/bin/python -m unittest -v

      - name: Calculate release version and package source
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < VERSION)"
          VERSION="${MANUAL_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(python3 - "$BASE" "$GITHUB_REPOSITORY" "$GH_TOKEN" <<'PY'
          import json, re, sys, urllib.request
          base, repo, token = sys.argv[1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+", base):
              raise SystemExit("VERSION must be semantic version X.Y.Z.")
          major, minor, patch = map(int, base.split("."))
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/latest",
              headers={"Accept":"application/vnd.github+json", "Authorization":f"Bearer {token}", "User-Agent":"IP-Archive-Release"})
          try:
              with urllib.request.urlopen(req, timeout=10) as response:
                  tag = json.load(response).get("tag_name", "").removeprefix("v")
          except Exception:
              tag = ""
          if re.fullmatch(r"\d+\.\d+\.\d+", tag):
              base_tuple = (major, minor, patch)
              latest_tuple = tuple(map(int, tag.split(".")))
              if base_tuple > latest_tuple:
                  # VERSION explicitly starts a newer major/minor series.
                  next_version = base_tuple
              else:
                  # Never publish an automatically generated version below
                  # the latest release, including after a manual major bump.
                  next_version = (latest_tuple[0], latest_tuple[1], latest_tuple[2] + 1)
          else:
              next_version = (major, minor, patch)
          print(".".join(map(str, next_version)))
          PY
          )"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          printf '%s\n' "$VERSION" > VERSION
          python3 - "$VERSION" <<'PY'
          import pathlib, sys, zipfile
          version=sys.argv[1]
          root=pathlib.Path(".")
          output=pathlib.Path(f"station-archive-v{version}.zip")
          include=["app.py","requirements.txt","setup_admin.py","install.sh","station-archive-update","upgrade_existing.sh","reconfigure_server.sh","update.sh","uninstall.sh","VERSION","README.md"]
          with zipfile.ZipFile(output,"w",zipfile.ZIP_DEFLATED) as archive:
              for item in include:
                  path=root/item
                  if path.is_file():
                      archive.write(path, item)
              for folder in ("templates","static"):
                  for path in sorted((root/folder).rglob("*")):
                      if path.is_file():
                          archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              required={"app.py","requirements.txt","VERSION","station-archive-update","reconfigure_server.sh","update.sh","templates","static"}
              names=set(archive.namelist())
              missing=[name for name in required if not any(n==name or n.startswith(name+"/") for n in names)]
              if missing:
                  raise SystemExit("Release package missing: "+", ".join(sorted(missing)))
          print(f"Built {output}")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=station-archive-$TAG.zip" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: IP Archive ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: station-archive-${{ steps.package.outputs.tag }}.zip
      - name: Keep only the newest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "IP-Archive-Release-Retention",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def request(path, method="GET"):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      body = response.read()
                      return json.loads(body.decode()) if body else None
              except urllib.error.HTTPError as exc:
                  if method == "DELETE" and exc.code == 404:
                      return None
                  raise
          releases = []
          page = 1
          while page <= 10:
              batch = request(f"/releases?per_page=100&page={page}") or []
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          releases.sort(key=lambda item: item.get("published_at") or item.get("created_at") or "", reverse=True)
          stale = releases[1:]
          print(f"Found {len(releases)} releases; keeping the newest release and deleting {len(stale)} older releases.")
          for release in stale:
              rid = release["id"]
              tag = release.get("tag_name", "")
              request(f"/releases/{rid}", "DELETE")
              print(f"Deleted release {tag} (id {rid}).")
              if tag:
                  try:
                      request(f"/git/refs/tags/{urllib.parse.quote(tag, safe='')}", "DELETE")
                      print(f"Deleted tag {tag}.")
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (404, 422):
                          raise
                      print(f"Tag {tag} was already absent or could not be deleted ({exc.code}); continuing.")
          PY
